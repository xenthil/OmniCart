services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: omnicart-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      # -C trusts the server cert for this local health check; fine for dev
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  identity-api:
    build:
      context: .
      dockerfile: src/OmniCart.Identity.Api/Dockerfile
    container_name: omnicart-identity-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Listen on HTTP (internal container port 8080) and HTTPS (443)
      ASPNETCORE_URLS: http://+:8080;https://+:443
      # Kestrel certificate (mounted below)
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/identity.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: "devpassword"
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=OmniCartIdentityDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: "OmniCart.Identity"
      Jwt__Audience: "OmniCart.Clients"
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "7001:8080"   # HTTP for compatibility
      - "7443:443"    # HTTPS (host 7443 -> container 443)
    volumes:
      - ./certs/identity.pfx:/https/identity.pfx:ro

  gateway:
    build:
      context: .
      dockerfile: src/OmniCart.Gateway/Dockerfile
    container_name: omnicart-gateway
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Listen on HTTP (internal container port 8080) and HTTPS (443)
      ASPNETCORE_URLS: http://+:8080;https://+:443
      # Kestrel certificate (mounted below)
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/gateway.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: "devpassword"
      # "identity-api" here resolves via Docker's internal DNS to the
      # identity-api service above — no localhost/port juggling needed.
      ReverseProxy__Clusters__identity-api__Destinations__identity-api__Address: "http://identity-api:8080"
    depends_on:
      - identity-api
    ports:
      - "7038:8080"
      - "7444:443"
    volumes:
      - ./certs/gateway.pfx:/https/gateway.pfx:ro

volumes:
  sqlserver-data:
